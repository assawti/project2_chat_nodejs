- name: Deploy Real-Time Chat App
  hosts: chat
  become: yes

  tasks:
    - name: Install required packages
      apt:
        name: ['nodejs', 'npm', 'nginx', 'git']
        state: present
        update_cache: yes

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Clone your app repo
      git:
        repo: 'https://github.com/your-username/your-repo.git'
        dest: /home/ubuntu/chat-app
        version: main

    - name: Configure NGINX reverse proxy
      copy:
        dest: /etc/nginx/sites-available/chat-app
        content: |
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    - name: Enable NGINX site config
      file:
        src: /etc/nginx/sites-available/chat-app
        dest: /etc/nginx/sites-enabled/chat-app
        state: link
        force: yes

    - name: Remove default NGINX config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Restart NGINX
      systemd:
        name: nginx
        state: restarted

    - name: Start app with PM2
      shell: |
        cd /home/ubuntu/chat-app
        pm2 start app.js
        pm2 save
